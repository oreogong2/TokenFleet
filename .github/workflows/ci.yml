name: TokenFleet CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tokenfleet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: Server, Web, PostgreSQL, and live E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: tokenfleet-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install isolated test dependencies
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/pip install --upgrade pip==26.1.2
          .ci-venv/bin/pip install \
            -r server/requirements-dev.txt \
            -r web/requirements-dev.txt \
            -c server/constraints.txt
          .ci-venv/bin/python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install --yes zsh

      - name: Reject known Python dependency vulnerabilities
        run: .ci-venv/bin/pip-audit --local --progress-spinner off

      - name: Run SQLite and PostgreSQL server gates
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://postgres:tokenfleet-ci-only@127.0.0.1:5432/postgres
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          cd server
          ../.ci-venv/bin/pytest -p no:cacheprovider -q

      - name: Run Web unit and mutating-script safety gates
        run: |
          cd web
          npm test
          cd ..
          PYTHONDONTWRITEBYTECODE=1 .ci-venv/bin/python script/verify_mutating_test_safety.py

      - name: Verify public-source ZIP encoding and privacy gate
        run: |
          python - "$RUNNER_TEMP/tokenfleet-private-markers.txt" <<'PY'
          from pathlib import Path
          import secrets
          import sys

          suffix = secrets.token_hex(16)
          Path(sys.argv[1]).write_text(
              f"ci-{suffix}@example.invalid\n"
              f"/ci-private/{suffix}\n"
              f"synthetic-origin-{suffix}\n",
              encoding="utf-8",
          )
          PY
          chmod 0600 "$RUNNER_TEMP/tokenfleet-private-markers.txt"
          python -m unittest -v script/test_verify_public_source_archive.py
          git archive --format=zip --prefix=TokenFleet-ci/ \
            --output="$RUNNER_TEMP/tokenfleet-public-source.zip" HEAD
          python script/verify_public_source_archive.py \
            --private-markers-file "$RUNNER_TEMP/tokenfleet-private-markers.txt" \
            "$RUNNER_TEMP/tokenfleet-public-source.zip"

      - name: Run isolated static-browser matrix
        run: |
          set -euo pipefail
          .ci-venv/bin/python -m http.server 4310 --directory web >"$RUNNER_TEMP/tokenfleet-static-web.log" 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4310/ >/dev/null; then
              break
            fi
            sleep 0.25
          done
          .ci-venv/bin/python script/verify_tokenfleet_web.py
          cd web
          ../.ci-venv/bin/python tests/community_browser.py

      - name: Verify one-command development startup
        run: PYTHONDONTWRITEBYTECODE=1 .ci-venv/bin/python script/verify_tokenfleet_dev_start.py --venv .ci-venv

      - name: Run guarded live API and browser E2E
        env:
          TOKENFLEET_DEV_VENV: ${{ github.workspace }}/.ci-venv
          TOKENFLEET_DEV_SKIP_INSTALL: "1"
          TOKENFLEET_DEV_STATE_DIR: ${{ runner.temp }}/tokenfleet-live
          TOKENFLEET_DEV_PORT: "4311"
          TOKENFLEET_E2E_ORG: dev-team
          TOKENFLEET_E2E_ADMIN: admin@example.com
          TOKENFLEET_E2E_PASSWORD: tokenfleet-local-dev-only
          PUBLIC_ORG_SLUG: dev-team
          TOKENFLEET_E2E_CONFIRM_BASE_URL: http://127.0.0.1:4311
          TOKENFLEET_LIVE_BASE_URL: http://127.0.0.1:4311
          TOKENFLEET_ALLOW_MUTATING_E2E: "YES"
          TOKENFLEET_VERIFY_EDGE_VALUES: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          ./script/start_tokenfleet_dev.sh >"$RUNNER_TEMP/tokenfleet-live.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:4311/readyz >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:4311/readyz >/dev/null
          .ci-venv/bin/python script/verify_tokenfleet_empty_web.py
          .ci-venv/bin/python script/verify_tokenfleet_e2e.py --allow-write-test-data --edge-values
          .ci-venv/bin/python script/verify_tokenfleet_live_web.py

  desktop:
    name: Apple Silicon client and universal distribution
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install desktop verification tools
        run: brew install ripgrep

      - name: Run the real XCTest suite
        run: swift test --package-path TokenStepSwift --parallel

      - name: Run complete Swift and collector verification
        run: |
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          TOKENFLEET_SWIFT_SDK="$SDK_PATH" bash script/verify_tokenstep_swift.sh

      - name: Run x86_64 share render and complete Swift gate under Rosetta
        run: |
          if ! arch -x86_64 /usr/bin/true; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          TOKENFLEET_SWIFT_SDK="$SDK_PATH" \
          TOKENFLEET_SWIFT_TEST_ARCHITECTURE="x86_64" \
          TOKENFLEET_REQUIRE_SHARE_CARD_RENDER="1" \
            bash script/verify_tokenstep_swift.sh

      - name: Build and verify Intel + Apple Silicon app slices
        run: |
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          TOKENFLEET_SWIFT_SDK="$SDK_PATH" \
          TOKENFLEET_ARCHITECTURES="arm64 x86_64" \
            bash script/build_swiftui_and_run.sh --no-launch
          for binary in \
            TokenStepSwift/dist/TokenFleet.app/Contents/MacOS/TokenFleet \
            TokenStepSwift/dist/TokenFleet.app/Contents/Helpers/TokenFleetHelper; do
            architectures="$(lipo -archs "$binary")"
            [[ " $architectures " == *" arm64 "* ]]
            [[ " $architectures " == *" x86_64 "* ]]
          done

      - name: Verify free source installation safety in an isolated Keychain
        run: |
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          TOKENFLEET_SWIFT_SDK="$SDK_PATH" bash script/verify_source_distribution.sh

      - name: Run independent desktop identity and packaging preflight
        run: |
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          TOKENFLEET_SWIFT_SDK="$SDK_PATH" bash script/verify_tokenfleet_desktop_identity.sh

      - name: Reject whitespace and accidental secret files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" ]]; then
            git diff --check "$PR_BASE_SHA...HEAD"
          elif [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --check "$PUSH_BEFORE_SHA..HEAD"
          else
            git show --check --format= HEAD
          fi
          if git ls-files | grep -E '(^|/)(\.env|.*\.(p8|p12|pem|mobileprovision|key))$'; then
            echo "Tracked secret-bearing file pattern detected." >&2
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env\.' | grep -vE '(^|/)\.env\.example$'; then
            echo "Tracked environment file other than .env.example detected." >&2
            exit 1
          fi

  desktop-intel:
    name: Intel client, collector, sync, and source lifecycle
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Prove this job is running on Intel hardware
        run: |
          [[ "$(uname -m)" == "x86_64" ]]
          sysctl -n machdep.cpu.brand_string

      - name: Install desktop verification tools
        run: brew install ripgrep

      - name: Run non-GPU XCTest natively on Intel
        run: |
          # This Intel runner exposes no Metal device, so ImageRenderer aborts
          # before XCTest can report a skip. The same x86_64 render/copy/save
          # fixture runs under Rosetta in the GPU-capable Apple Silicon job.
          swift test --package-path TokenStepSwift --parallel --skip ScreenshotExporterTests
          swift test --package-path TokenStepSwift --filter 'ScreenshotExporterTests.test(EveryExportFailureNamesItsStage|GeneratedImageEncodesAsPNGAndJPGWithoutTIFFRoundTrip)'

      - name: Run collector, pricing, and sync gates natively on Intel
        run: |
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          TOKENFLEET_SWIFT_SDK="$SDK_PATH" \
          TOKENFLEET_REQUIRE_SHARE_CARD_RENDER="0" \
            bash script/verify_tokenstep_swift.sh

      - name: Build native Intel App and Helper
        run: |
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          TOKENFLEET_SWIFT_SDK="$SDK_PATH" \
          TOKENFLEET_ARCHITECTURES="x86_64" \
            bash script/build_swiftui_and_run.sh --no-launch
          for binary in \
            TokenStepSwift/dist/TokenFleet.app/Contents/MacOS/TokenFleet \
            TokenStepSwift/dist/TokenFleet.app/Contents/Helpers/TokenFleetHelper; do
            [[ "$(lipo -archs "$binary")" == "x86_64" ]]
          done

      - name: Exercise source install, upgrade, rollback, and uninstall on Intel
        run: |
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          TOKENFLEET_SWIFT_SDK="$SDK_PATH" \
          TOKENFLEET_ARCHITECTURES="x86_64" \
            bash script/verify_source_distribution.sh

      - name: Run desktop identity and packaging preflight on Intel
        run: |
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          TOKENFLEET_SWIFT_SDK="$SDK_PATH" \
          TOKENFLEET_ARCHITECTURES="x86_64" \
            bash script/verify_tokenfleet_desktop_identity.sh

  windows-client:
    name: Windows participant client
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run cross-platform collector and protocol tests
        working-directory: clients/windows
        run: python -m unittest discover -s tests -v

      - name: Compile the source package
        working-directory: clients/windows
        run: python -m compileall -q tokenfleet tokenfleet_cli.py

      - name: Validate the PowerShell source installer without installing
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\clients\windows\install.ps1 -CommunityServer https://community.example -ValidateOnly

      - name: Exercise Windows install, upgrade, preview, and uninstall
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          powershell -NoProfile -ExecutionPolicy Bypass -File .\clients\windows\install.ps1 -CommunityServer https://community.example -NoPathUpdate
          $launcher = Join-Path $env:LOCALAPPDATA "TokenFleet\bin\tokenfleet.cmd"
          & $launcher preview --json
          if ($LASTEXITCODE -ne 0) { throw "TokenFleet preview failed" }
          & $launcher status --json
          if ($LASTEXITCODE -ne 0) { throw "TokenFleet status failed" }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\clients\windows\install.ps1 -CommunityServer https://community.example -NoPathUpdate
          powershell -NoProfile -ExecutionPolicy Bypass -File .\clients\windows\uninstall.ps1 -Yes
          if (Test-Path (Join-Path $env:LOCALAPPDATA "TokenFleet")) { throw "TokenFleet uninstall left the install root behind" }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\clients\windows\install.ps1 -CommunityServer https://community.example -NoPathUpdate
          schtasks.exe /Create /SC DAILY /ST 23:59 /TN "TokenFleet Community Sync" /TR "cmd.exe /c exit 0" /F | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "TokenFleet scheduled-task fixture could not be created" }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\clients\windows\uninstall.ps1 -Yes
          if (Get-ScheduledTask -TaskName "TokenFleet Community Sync" -ErrorAction SilentlyContinue) { throw "TokenFleet uninstall left the scheduled task behind" }
          if (Test-Path (Join-Path $env:LOCALAPPDATA "TokenFleet")) { throw "TokenFleet second uninstall left the install root behind" }
